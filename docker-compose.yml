name: pos-cloud

networks:
  pos-cloud-network:
    name: pos-cloud-network

volumes:
  pos-cloud-postgres-data:
    name: pos-cloud-postgres-data
  pos-cloud-redis-data:
    name: pos-cloud-redis-data

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-cloud-postgres
    restart: unless-stopped
    env_file:
      - ../config/pos-cloud/infrastructure.env
      - ../config/pos-cloud/api.env
    # infrastructure.env declares its own POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB, separately
    # from api.env's/worker.env's DATABASE_USER/DATABASE_PASSWORD/DATABASE_NAME that the API and
    # worker actually authenticate with. Bootstrapping Postgres under the DATABASE_* values
    # (rather than the separately-declared POSTGRES_* ones) guarantees the two can never drift
    # apart, without this repo ever reading either file's actual secret values.
    entrypoint:
      - sh
      - -c
      - >
        export POSTGRES_USER="$$DATABASE_USER" POSTGRES_PASSWORD="$$DATABASE_PASSWORD" POSTGRES_DB="$$DATABASE_NAME";
        exec docker-entrypoint.sh postgres
    # Exposed on a non-default host port to avoid clashing with any local PostgreSQL install.
    ports:
      - "5433:5432"
    volumes:
      - pos-cloud-postgres-data:/var/lib/postgresql/data
    networks:
      - pos-cloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DATABASE_USER -d $$DATABASE_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pos-cloud-redis
    restart: unless-stopped
    # Exposed on a non-default host port to avoid clashing with any local Redis install.
    ports:
      - "6380:6379"
    volumes:
      - pos-cloud-redis-data:/data
    networks:
      - pos-cloud-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  pos-cloud-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: api
    container_name: pos-cloud-api
    restart: unless-stopped
    env_file:
      - ../config/pos-cloud/infrastructure.env
      - ../config/pos-cloud/api.env
    # Container networking always targets the compose service names/internal ports, regardless of
    # what infrastructure.env sets for other (non-Docker) run modes.
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "5100:5100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-cloud-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.APP_PORT || 5100) + '/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pos-cloud-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        APP_NAME: worker
    container_name: pos-cloud-worker
    restart: unless-stopped
    env_file:
      - ../config/pos-cloud/infrastructure.env
      - ../config/pos-cloud/worker.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-cloud-network
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
